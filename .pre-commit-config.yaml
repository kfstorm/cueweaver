repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: check-ast
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/.*/fixtures/

  - repo: local
    hooks:
      - id: quality-checks
        name: Backend lint and checks
        entry: scripts/lint-backend.sh --check
        language: system
        types: [python]
        pass_filenames: false

      - id: markdown-lint
        name: Markdown lint
        entry: uv run pymarkdown -d MD013,MD036 scan -r AGENTS.md CONTEXT.md README.md docs
        language: system
        types: [markdown]
        pass_filenames: false

      - id: unit-tests
        name: Python unit tests
        entry: scripts/test-backend.sh
        language: system
        pass_filenames: false

      - id: web-checks
        name: Frontend lint and checks
        entry: scripts/lint-frontend.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: web-unit-tests
        name: Frontend unit tests
        entry: scripts/test-frontend.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: duplication
        name: Duplication check
        entry: npx --yes jscpd
        language: system
        pass_filenames: false

default_stages: [pre-commit]
fail_fast: false
